name: Auth Profile Frontend Validation

on:
  push:
    branches:
      - security/gate-auth-profile-credential-actions
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - '.github/workflows/auth-profile-frontend-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --configuration=development

      - name: Run headless Angular tests
        run: npm run test:ci
