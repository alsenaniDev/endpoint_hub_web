<!-- Toast stack — fixed top-right, outside any stacking context -->
<div class="toast-stack">
  <div class="toast-item" *ngFor="let t of toasts()">
    <div class="toast-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </div>
    <div class="toast-body">
      <span class="toast-label">New notification</span>
      <p class="toast-msg">{{ t.message }}</p>
    </div>
    <button class="toast-close" (click)="dismissToast(t)">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <div class="toast-progress"></div>
  </div>
</div>

<!-- Bell button -->
<div class="notif-bell-wrap">
  <button class="notif-btn" [class.has-unread]="unreadCount() > 0" [class.active]="open()"
    (click)="toggle()" [attr.title]="'workbench.nav.notifications' | t"
    [attr.aria-label]="'workbench.nav.notifications' | t">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="notif-badge" *ngIf="unreadCount() > 0">
      {{ unreadCount() > 99 ? '99+' : unreadCount() }}
    </span>
  </button>

  <!-- Dropdown panel -->
  <div class="notif-panel" *ngIf="open()">
    <div class="notif-panel-header">
      <div class="notif-panel-title-wrap">
        <span class="notif-panel-title">{{ 'workbench.nav.notifications' | t }}</span>
        <span class="notif-count-chip" *ngIf="unreadCount() > 0">{{ unreadCount() }} new</span>
      </div>
      <button class="notif-mark-all" *ngIf="canMutate() && unreadCount() > 0" (click)="markAll()">
        Mark all read
      </button>
    </div>

    <div class="notif-list">
      <p *ngIf="errorKey()" role="alert">{{ errorKey()! | t }}</p>
      <div class="notif-empty" *ngIf="realtimeError()" role="alert">
        <p>Live notifications are unavailable. Stored notifications remain available.</p>
        <button type="button" class="notif-mark-all" (click)="retryRealtime()">Reconnect</button>
      </div>
      <div class="notif-empty" *ngIf="!errorKey() && recent().length === 0">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <p>No notifications yet</p>
      </div>

      <div class="notif-item" *ngFor="let n of recent()"
           [class.unread]="!n.isRead" (click)="clickNotif(n)">
        <div class="notif-avatar" [class.unread]="!n.isRead">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
            <polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
          </svg>
        </div>
        <div class="notif-body">
          <p class="notif-msg">{{ n.message }}</p>
          <span class="notif-time">{{ timeAgo(n.createdAt) }}</span>
        </div>
        <div class="notif-unread-dot" *ngIf="!n.isRead"></div>
      </div>
    </div>
  </div>
</div>
